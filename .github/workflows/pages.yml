name: Deploy Dartfigyelő to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download and verify OpenCV
        run: node scripts/prepare-opencv.mjs
      - name: Check JavaScript syntax
        run: |
          node --check dist/app.js
          node --check dist/board-vision.mjs
      - name: Test dartboard detection
        run: node tests/vision.test.mjs
      - name: Test bull-anchored automatic recognition
        run: node tests/bull-vision.test.mjs
      - name: Test watching controls
        run: node tests/controls.test.mjs
      - name: Test zoom and retrieval guard
        run: node tests/camera-safety.test.mjs
      - name: Test small persistent hits
        run: node tests/small-hit.test.mjs
      - name: Test diagonal and edge hits
        run: node tests/edge-hits.test.mjs
      - name: Test manual perspective calibration
        run: node tests/calibration.test.mjs
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
